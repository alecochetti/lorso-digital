<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Aprovar pedido · LORSO Digital</title>
<link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/assets/admin.css">
</head><body>
<div class="center"><div class="box">
  <a class="logo" href="/" id="logo"><b>LORSO Digital</b></a>
  <h1 id="titulo">Pedido de acesso</h1>
  <p id="texto"></p>
  <button class="btn" type="button" id="confirmar" hidden>Confirmar</button>
  <div class="msg" id="msg" role="alert"></div>
</div></div>

<script type="module">
import { chamarFuncao, LOGO } from "/admin/assets/auth.js";

document.getElementById("logo").insertAdjacentHTML("afterbegin", LOGO);
const $ = (id) => document.getElementById(id);
const q = new URLSearchParams(location.search);
const id = q.get("id"), t = q.get("t"), a = q.get("a");
const ACOES = { diagnostico: "Aprovar Diagnóstico", lancamento: "Aprovar Lançamentos", dre: "Aprovar DRE", recusar: "Recusar" };

// tira o token da barra de endereço (não fica no histórico)
history.replaceState(null, "", location.pathname);

if (!id || !t || !ACOES[a]) {
  $("texto").textContent = "Link incompleto. Abra de novo a partir do e-mail.";
} else {
  // Só dispara no clique: leitores de e-mail abrem links sozinhos.
  $("titulo").textContent = `Confirmar: ${ACOES[a]} para este pedido?`;
  $("texto").textContent = a === "recusar"
    ? "O pedido será marcado como recusado e a pessoa não recebe acesso."
    : "O espaço do cliente será criado com este módulo e o convite sai por e-mail.";
  $("confirmar").textContent = ACOES[a];
  $("confirmar").hidden = false;
  $("confirmar").addEventListener("click", async () => {
    const b = $("confirmar");
    b.disabled = true; b.textContent = "Processando…";
    $("msg").textContent = ""; $("msg").className = "msg";
    try {
      const r = await chamarFuncao("decidir-acesso", { id, t, acao: a });
      b.hidden = true;
      $("titulo").textContent = a === "recusar" ? "Pedido recusado" : "Acesso liberado";
      $("texto").textContent = "";
      $("msg").textContent = r.mensagem || "Feito.";
      $("msg").className = "msg ok";
    } catch (err) {
      b.disabled = false; b.textContent = ACOES[a];
      $("msg").textContent = err.message;
      $("msg").className = "msg erro";
    }
  });
}
</script>
</body></html>
