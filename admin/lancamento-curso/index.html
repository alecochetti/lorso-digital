 return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:b64(P.s),iterations:P.n},k,256));}
async function abrir(raw){const k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
 const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.i)},k,b64(P.c));
 const h=new TextDecoder().decode(pt);document.open();document.write(h);document.close();const t=h.match(/<title>([^<]*)/i);if(t)document.title=t[1];}

   try{(lem?localStorage:sessionStorage).setItem(K,enc(raw))}catch(_){}
