const { data } = await supabase.from("app_recursos").select("conteudo").eq("nome","chave_demos").maybeSingle();
if (!data) {

} else {
  try {
    const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
    const k=await crypto.subtle.importKey("raw",b64(data.conteudo),"AES-GCM",false,["decrypt"]);
    const h=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.i)},k,b64(P.c)));
    document.open(); document.write(h); document.close();
  } catch (e) {
